# ==============================================================================
#                      GlowSalary - Текстовые сообщения
#             Форматирование: Adventure MiniMessage (теги: <color>, <gradient>, etc.)
# ==============================================================================

prefix: "<gradient:#38bdf8:#818cf8><b>Зарплата</b></gradient> <dark_gray>»</dark_gray> "

salary:
  # Выплата обычной денежной зарплаты
  money-received: "<prefix><gray>Вы получили зарплату: <green>+<amount></green> монет! <dark_gray>(Уровень выплаты: <aqua>#<streak></aqua>)</dark_gray></gray>"

  # Редкая выплата в сапфирах
  sapphire-received: "<prefix><gradient:#38bdf8:#60a5fa><b>УДАЧА!</b></gradient> <gray>Вместо денег вам начислена особая зарплата: <aqua>+<amount></aqua> <dark_gray>(Сапфировый уровень: <blue>#<streak></blue>)</dark_gray></gray>"

  # Сообщение при попытке забрать зарплату во время активного кулдауна
  # Доступные плейсхолдеры: <time> (оставшееся время), <next_amount> (размер следующей денежной зарплаты), <group> (группа игрока)
  cooldown-active:
    - "<prefix><gray>Вы уже забирали зарплату недавно.</gray>"
    - "<gray>Следующая выплата будет доступна через: <aqua><time></aqua>.</gray>"
    - "<gray>Размер вашей следующей зарплаты составит: <green><next_amount></green> монет <dark_gray>(группа: <yellow><group></yellow>)</dark_gray>.</gray>"

admin:
  reload-success: "<prefix><green>Конфигурация и сообщения успешно перезагружены!</green>"
  reset-success: "<prefix><green>Прогресс и кулдаун игрока <aqua><player></aqua> успешно сброшены!</green>"
  player-not-found: "<prefix><red>Игрок <yellow><player></yellow> не найден в базе данных.</red>"
  unknown-command: "<prefix><red>Неизвестная подкоманда. Используйте: <yellow>/glowsalary reload</yellow> или <yellow>/glowsalary reset <ник></yellow></red>"
  only-player: "<prefix><red>Эта команда доступна только игрокам на сервере.</red>"
  no-permission: "<prefix><red>У вас нет прав для выполнения этой команды.</red>"
