# ==============================================================================
#                      GlowSalary - Конфигурация плагина
#                Разработчик: pluginsfix | Платформа: Paper / Folia (Java 21)
# ==============================================================================

# Версия конфигурации для автоматической проверки совместимости. Не изменяйте.
config-version: 1

# Глобальный кулдаун между выплатами зарплаты по умолчанию (в секундах).
# 7200 секунд = 2 часа.
default-cooldown-seconds: 7200

# Интервал автоматического сброса кеша профилей в базу данных SQLite (в минутах).
auto-save-interval-minutes: 5

# Настройки специальной зарплаты в сапфирах (выдаётся с определённым шансом вместо денег).
sapphire:
  # Включена ли механика сапфировых выплат.
  enabled: true

  # Шанс выпадения сапфиров вместо обычной денежной зарплаты (в процентах от 0.0 до 100.0).
  chance-percent: 15.0

  # Базовое количество сапфиров при первой выплате.
  base-amount: 1

  # Шаг увеличения количества сапфиров за каждую успешную сапфировую зарплату.
  increment-per-claim: 1

  # Максимальное количество сапфиров за одну выплату.
  max-amount: 10

  # Звуковой эффект при получении редкой сапфировой зарплаты (Minecraft sound key).
  # Оставьте пустым (""), чтобы отключить звук.
  sound: "entity.player.levelup"

  # Консольные команды для начисления сапфиров игроку.
  # Доступные плейсхолдеры: <player> (никнейм), <amount> (количество).
  reward-commands:
    - 'minecraft:give <player> minecraft:lapis_lazuli[minecraft:custom_name=''{"text":"Сапфир","color":"#38bdf8","bold":true}'',minecraft:lore=[''{"text":"Редкая валюта сервера","color":"gray"}'']] <amount>'

# Настройки денежных выплат по группам прав (LuckPerms).
# Если игрок не состоит ни в одной из перечисленных групп, используется группа 'default'.
# Если игрок состоит в нескольких группах, выбирается группа с наибольшим приоритетом в LuckPerms.
groups:
  default:
    # Базовый размер первой выплаты.
    base-salary: 150.0
    # На сколько монет увеличивается зарплата после каждой выплаты.
    increment-per-claim: 15.0
    # Максимальный возможный размер зарплаты.
    max-salary: 600.0
    # Индивидуальный кулдаун для данной группы (в секундах). 0 — использовать default-cooldown-seconds.
    cooldown-seconds: 7200

  vip:
    base-salary: 300.0
    increment-per-claim: 30.0
    max-salary: 1200.0
    cooldown-seconds: 5400

  premium:
    base-salary: 500.0
    increment-per-claim: 50.0
    max-salary: 2500.0
    cooldown-seconds: 3600

  deluxe:
    base-salary: 1000.0
    increment-per-claim: 100.0
    max-salary: 5000.0
    cooldown-seconds: 1800
